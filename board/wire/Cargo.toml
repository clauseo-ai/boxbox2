[package]
name = "boxbox-board-wire"
version = "0.1.0"
description = "the board channel's wire: what the boxbox server and the board daemon say to each other"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# the server describes these shapes in its openapi document, so the web app's
# decoders are generated from the same types the daemon compiles against. the
# daemon builds without it and never links utoipa.
openapi = ["dep:utoipa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
utoipa = { version = "6.0", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
