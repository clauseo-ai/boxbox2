[package]
name = "boxbox"
version = "0.1.0"
description = "the boxbox server: one binary between your agents and your devices"
keywords = ["coding-agents", "cmx2", "web-push", "sse"]
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
rust-version.workspace = true
publish.workspace = true
build = "build/main.rs"

[[bin]]
name = "boxbox"
path = "src/main.rs"

[lints]
workspace = true

[features]
# the fleet actor writes every input it takes, with the clock it took it at,
# to the file named by BOXBOX_RECORD (`fleet/record.rs`). off in every
# release; `bun bench/golden.ts record` builds with it to record the replay
# fixture.
record = []

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "ws"] }
base64ct = { version = "1.8", features = ["alloc"] }
boxbox-board-wire = { path = "../board/wire", features = ["openapi"] }
bytes = "1.12"
data-encoding = "2.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hmac = "0.13"
# thumbnails: the png and webp codecs only; the scaling is media/thumbs.rs
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
jiff = "0.2.37"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "rustls", "stream"] }
rpassword = "7.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rust-embed = { version = "8.12", features = ["interpolate-folder-path", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11"
subtle = "2.6"
tar = { version = "0.4", default-features = false }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6.11", default-features = false, features = ["compression-gzip"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "smallvec"] }
utoipa = "6.0"
web-push-native = { version = "0.5", default-features = false }

[build-dependencies]
heck = "0.5"
prettyplease = "0.3"
proc-macro2 = "1"
quote = "1"
schemars = "0.8.22"
serde_json = "1.0.151"
syn = { version = "3", features = ["full"] }
typify = "0.8.0"

[dev-dependencies]
# the pixel check hook measures jpeg too (media/thumbs/tests.rs); the server never encodes it
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
tokio = { version = "1.53", features = ["test-util"] }
