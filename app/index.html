<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- no viewport-fit=cover: the app starts below the status bar and never
         owns the camera cutout (decision 19, the ios viewport law) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <!-- installed to the home screen: the manifest for chromium, these for ios
         (docs/push.md, ios installed to the home screen). the status bar stays
         the system's own (default style), since the app never draws under it;
         its strip is the theme-color, which the deck's open stage sets to the
         top of its flood (settings/appearance.ts, holdChrome) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="boxbox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="watch and steer your coding agents" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <title>boxbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
