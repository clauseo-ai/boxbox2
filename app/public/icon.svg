<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- the icon is the fleet, the ios app's icon (boxbox-ios, Boxbox/AppIcon.icon, written by scripts/icon/fleet.py): three
       windows in the repo palette's light tones, fanned about one point near their foot (violet -17°, gold 17°, teal in
       front, upright), on the deep violet ground. the ios document is drawn at 1024; this is the same geometry at 512, with
       its liquid glass flattened to what an svg holds: each window's light-to-deep fill, a lit top edge, a dark rim and a
       soft shadow in the window's own colour. the fills are the
       light and deep tones as the ios render shows them through the glass (Icon Composer's ictool, default rendition), a
       little softer than the palette's own. scripts/icons.ts rasterises this drawing and keys on the shape and the work group below. -->
  <defs>
    <rect id="shape" width="512" height="512" rx="112"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <rect id="win" x="151" y="98" width="210" height="276" rx="54"/>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2=".7">
      <stop offset="0" stop-color="#2e2860"/>
      <stop offset="1" stop-color="#100f1c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="98" x2="0" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="98" x2="0" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ab9ff5"/>
      <stop offset="1" stop-color="#9184e6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="98" x2="0" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9cf79"/>
      <stop offset="1" stop-color="#d4b964"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="98" x2="0" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a0e3da"/>
      <stop offset="1" stop-color="#73c0b6"/>
    </linearGradient>
    <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="rim" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#ground)"/>
    <use href="#shape" fill="none" stroke="url(#edge)" stroke-width="6"/>
    <g id="work">
      <g transform="rotate(-17 256 350)">
        <use href="#win" fill="#8c7ef0" opacity=".28" filter="url(#cast)" transform="translate(0 8)"/>
        <use href="#win" fill="#06050c" opacity=".7" filter="url(#rim)"/>
        <use href="#win" fill="url(#violet)"/>
        <use href="#win" fill="none" stroke="url(#lit)" stroke-width="2"/>
      </g>
      <g transform="rotate(17 256 350)">
        <use href="#win" fill="#e0b84e" opacity=".28" filter="url(#cast)" transform="translate(0 8)"/>
        <use href="#win" fill="#06050c" opacity=".7" filter="url(#rim)"/>
        <use href="#win" fill="url(#gold)"/>
        <use href="#win" fill="none" stroke="url(#lit)" stroke-width="2"/>
      </g>
      <g>
        <use href="#win" fill="#4fc2b6" opacity=".28" filter="url(#cast)" transform="translate(0 8)"/>
        <use href="#win" fill="#06050c" opacity=".7" filter="url(#rim)"/>
        <use href="#win" fill="url(#teal)"/>
        <use href="#win" fill="none" stroke="url(#lit)" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
