  <!-- the icon is a window (docs/design.md, installed to the home screen): the violet pair full bleed with the window's
       highlight and lit top edge, and a live tail with its cursor. the words are boxbox sans (wght 650, wdth 112) and
       martian mono (wght 400, wdth 90) outlined to paths, so every renderer draws them without the fonts.
       scripts/icons.ts rasterises this drawing and keys on the shape and the work group below. -->
  <defs>
    <rect id="shape" width="512" height="512" rx="112"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <linearGradient id="window" x1=".41" y1="0" x2=".59" y2="1">
      <stop offset="0" stop-color="#34298a"/>
      <stop offset="1" stop-color="#171240"/>
    </linearGradient>
    <radialGradient id="highlight" cx=".06" cy="-.04" r="1.05">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#window)"/>
    <rect width="512" height="512" fill="url(#highlight)"/>
    <use href="#shape" fill="none" stroke="url(#edge)" stroke-width="6"/>
