<path d="M180 77L210 77" fill="none" stroke="#5b52a8" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" marker-end="url(#m-5b52a8)"/>
<rect x="210" y="42" width="140" height="74" rx="13" fill="#34298a" fill-opacity=".08"/>
<rect x="210" y="40" width="140" height="74" rx="13" fill="url(#f-violet-1)"/>
<rect x="210.5" y="40.5" width="139" height="73" rx="12.5" fill="none" stroke="#34298a" stroke-opacity="0.18"/>
<text x="280" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#34298a">upstream watcher</text>
<text x="280" y="90.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#59509f" fill-opacity=".92">drops repeats</text>
