<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img" aria-labelledby="t d">
<title id="t">a cursor at every hop</title>
<desc id="d">events flow from the cmx2 daemon to the boxbox watcher, the journal, the sync worker and the ui. each hop keeps a cursor: the daemon's seq, a host and seq the watcher dedupes by, the journal's epoch and seq, and the worker's cursor in indexeddb. the watcher and the worker each resume from their cursor with Last-Event-ID.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#ebe8fb"/></linearGradient><linearGradient id="f-teal-1" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#d3f4f1"/><stop offset="1" stop-color="#edfbf9"/></linearGradient><marker id="m-5b52a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#5b52a8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="f-violet-1" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#e7e2ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><linearGradient id="f-blue-1" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ddecff"/><stop offset="1" stop-color="#f1f7ff"/></linearGradient></defs>
<rect width="900" height="236" rx="22" fill="url(#g)"/>
<rect x=".5" y=".5" width="899" height="235" rx="21.5" fill="none" stroke="#34298a" stroke-opacity="0.14"/>
<rect x="40" y="42" width="140" height="74" rx="13" fill="#10484a" fill-opacity=".08"/>
<rect x="40" y="40" width="140" height="74" rx="13" fill="url(#f-teal-1)"/>
<rect x="40.5" y="40.5" width="139" height="73" rx="12.5" fill="none" stroke="#10484a" stroke-opacity="0.18"/>
<text x="110" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#10484a">cmx2 daemon</text>
<text x="110" y="90.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#3b696b" fill-opacity=".92">numbers events</text>
<rect x="54" y="130" width="112" height="24" rx="12" fill="none" stroke="#5b52a8" stroke-opacity=".55" stroke-dasharray="0"/>
