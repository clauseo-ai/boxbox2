<path d="M180 77L210 77" fill="none" stroke="#8f86c9" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" marker-end="url(#m-8f86c9)"/>
<rect x="210" y="43" width="140" height="74" rx="13" fill="#000" fill-opacity=".3"/>
<rect x="210" y="40" width="140" height="74" rx="13" fill="url(#f-violet-1)"/>
<rect x="210.5" y="40.5" width="139" height="73" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text x="280" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#f4f4f6">upstream watcher</text>
<text x="280" y="90.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#b7abff" fill-opacity=".92">drops repeats</text>
<rect x="224" y="130" width="112" height="24" rx="12" fill="none" stroke="#8f86c9" stroke-opacity=".55" stroke-dasharray="0"/>
<text x="280" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#f4f4f6">(host, seq)</text>
<path d="M350 77L380 77" fill="none" stroke="#8f86c9" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" marker-end="url(#m-8f86c9)"/>
<rect x="380" y="43" width="140" height="74" rx="13" fill="#000" fill-opacity=".3"/>
<rect x="380" y="40" width="140" height="74" rx="13" fill="url(#f-violet-1)"/>
<rect x="380.5" y="40.5" width="139" height="73" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
