<rect x="720.5" y="40.5" width="139" height="73" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text x="790" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#f4f4f6">ui thread</text>
<text x="790" y="90.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9cc8ff" fill-opacity=".92">patches per frame</text>
<rect x="734" y="130" width="112" height="24" rx="12" fill="none" stroke="#8f86c9" stroke-opacity=".55" stroke-dasharray="3 4"/>
<text x="790" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#a9a6c4">no cursor</text>
<path d="M280 158L280 183Q280 192 271 192L119 192Q110 192 110 183L110 158" fill="none" stroke="#8f86c9" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#m-8f86c9)"/>
<rect x="149.7" y="184.5" width="90.6" height="17" rx="8.5" fill="#100e24"/>
<text x="195" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#a9a6c4">Last-Event-ID</text>
<path d="M620 158L620 183Q620 192 611 192L459 192Q450 192 450 183L450 158" fill="none" stroke="#8f86c9" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#m-8f86c9)"/>
<rect x="489.7" y="184.5" width="90.6" height="17" rx="8.5" fill="#100e24"/>
<text x="535" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#a9a6c4">Last-Event-ID</text>
<text x="450" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a9a6c4">events go right. a hop that falls behind asks the one before it to go back to its own cursor.</text>
