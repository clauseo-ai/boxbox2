<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" role="img" aria-labelledby="t d">
<title id="t">one question, from an agent to a lock screen and back</title>
<desc id="d">an agent asks a question. the cmx2 daemon emits an event, boxbox raises a need and, because no screen is watching, sends a web push through the platform push service. the phone shows a banner. tapping it opens the app, which resumes its stream from its cursor and shows the question. the answer goes back through boxbox to the daemon, and the agent carries on.</desc>
