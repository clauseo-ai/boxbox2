<title id="t">how boxbox fits together</title>
<desc id="d">your app and board talk over https to the boxbox server, which holds a password gate, a fleet model, push and a terminal relay. the server keeps one event stream open to the cmx2 daemon on each of your machines and sends web push notifications back to the app.</desc>
