<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
<title id="t">what is inside the browser and the server</title>
<desc id="d">the browser has a ui thread, a sync worker and a service worker. the boxbox server has an http layer, a fleet actor, a journal, upstream watchers, a push task, a pty relay, a store writer and telemetry. the watchers and the relay talk to cmx2 daemons, and the push task reaches the service worker with web push.</desc>
